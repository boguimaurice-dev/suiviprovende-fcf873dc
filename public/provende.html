<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Provende — Inventaire &amp; Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f4f1ea;
  --paper: #fffdf8;
  --ink: #1c1915;
  --muted: #6b6458;
  --line: #e6dfd2;
  --accent: #2f6b4f;
  --accent-2: #c45c26;
  --warn: #b45309;
  --danger: #b42318;
  --ok: #177245;
  --chip: #eef6f1;
  --shadow: 0 10px 40px rgba(28,25,21,.08);
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; }
button, input, select, textarea { font-family: inherit; }
.app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
.side {
  background: #1c1915; color: #f4f1ea; padding: 28px 20px; display: flex; flex-direction: column; gap: 8px;
  position: sticky; top: 0; height: 100vh;
}
.brand { font-family: Fraunces, serif; font-size: 1.45rem; margin: 0 0 4px; letter-spacing: -.02em; }
.brand small { display: block; font-family: "DM Sans", sans-serif; font-size: .72rem; color: #c9c0b3; font-weight: 400; margin-top: 4px; }
.nav-btn {
  background: transparent; border: 0; color: #e8e0d4; text-align: left; padding: 11px 12px; border-radius: 10px;
  cursor: pointer; font-size: .92rem; display: flex; justify-content: space-between; align-items: center;
}
.nav-btn:hover, .nav-btn.active { background: #2a2620; color: #fff; }
.nav-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); display: none; }
.nav-btn.warn .dot { display: inline-block; }
.side-foot { margin-top: auto; font-size: .75rem; color: #9a9186; line-height: 1.4; }
.main { padding: 28px 32px 80px; max-width: 1400px; }
.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
h1 { font-family: Fraunces, serif; font-size: 1.8rem; margin: 0; }
.sub { color: var(--muted); margin: 6px 0 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 0; background: var(--accent); color: #fff; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 600;
}
.btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.btn.warn { background: var(--accent-2); }
.btn.danger { background: var(--danger); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 22px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.card .k { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.card .v { font-size: 1.35rem; font-weight: 700; margin-top: 6px; }
.card.alert { border-color: #f0c4b8; background: #fff6f3; }
.card.ok { border-color: #c9e6d4; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--paper); }
.table-wrap { overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: .72rem; font-weight: 600; }
.badge.ok { background: #e5f6ea; color: var(--ok); }
.badge.warn { background: #fff3d6; color: var(--warn); }
.badge.bad { background: #fde8e6; color: var(--danger); }
.row-actions { display: flex; gap: 6px; }
.icon-btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 8px; cursor: pointer; font-size: .78rem; }
.modal-bg { position: fixed; inset: 0; background: rgba(28,25,21,.45); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.modal-bg.show { display: flex; }
.modal { background: var(--paper); border-radius: 18px; width: min(720px, 100%); max-height: 90vh; overflow: auto; padding: 22px; }
.modal h2 { font-family: Fraunces, serif; margin: 0 0 14px; }
.grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-form label, .full label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
.grid-form input, .grid-form select, .full input, .full textarea, .full select {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
}
.full { grid-column: 1 / -1; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.day {
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px; min-height: 110px; padding: 8px; cursor: pointer;
}
.day:hover { border-color: var(--accent); }
.day.empty { background: transparent; border: 0; cursor: default; }
.day .n { font-weight: 700; }
.day .t { font-size: .75rem; color: var(--muted); margin-top: 4px; }
.pill { font-size: .68rem; background: var(--chip); color: var(--accent); padding: 2px 6px; border-radius: 6px; display: inline-block; margin: 2px 2px 0 0; }
.filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.search { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); min-width: 220px; }
.hidden { display: none !important; }
.formula-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.fcard h3 { margin: 0 0 4px; font-size: 1rem; }
.fcard .meta { color: var(--muted); font-size: .8rem; margin-bottom: 10px; }
.bar { height: 6px; background: #eee8dc; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.toast { position: fixed; bottom: 20px; right: 20px; background: #1c1915; color: #fff; padding: 12px 16px; border-radius: 12px; display: none; z-index: 30; }
.toast.show { display: block; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: relative; height: auto; flex-direction: row; flex-wrap: wrap; }
  .side-foot { display: none; }
  .main { padding: 16px; }
  .grid-form { grid-template-columns: 1fr; }
  .cal { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

function seedAugustDays() {
  const plan = {
    1:{A5:0.5,A6:0.5,A7:1}, 3:{A7:2}, 4:{A5:1,A6:1}, 5:{A7:1,faci:500},
    6:{A7:2.5}, 7:{CQ:0.5,faci:500}, 8:{A5:0.5,A6:0.5,A7:1}, 10:{A7:2},
    11:{A5:0.5,A6:0.5,A7:1}, 12:{A5:0.5,A6:0.5,A7:1}, 13:{A7:1,faci:500},
    14:{A5:0.5,A6:0.5,A7:1}, 15:{A7:1.5,faci:250}, 17:{A5:0.5,A6:0.5,A7:1},
    18:{A7:1,faci:750}, 19:{A5:0.5,A6:0.5,A7:1}, 20:{A7:1,faci:500},
    21:{A5:0.5,A6:0.5,A7:1}, 22:{A7:1.5,faci:250}, 24:{A5:0.5,A6:0.5,A7:1},
    25:{A7:0.5,faci:750}, 26:{A7:2}, 27:{A4:0.5,A5:0.5,A6:1},
    28:{A5:1,A7:1}, 29:{A6:0.5,A7:1.5}, 31:{A4:0.5,A7:1.5,faci:250}
  };
  const days = {};
  Object.entries(plan).forEach(([d, mix]) => {
    const date = `2026-08-${String(d).padStart(2,"0")}`;
    const formulas = {};
    let faci = 0;
    Object.entries(mix).forEach(([k,v]) => { if(k==="faci") faci=v; else formulas[k]=v; });
    days[date] = { formulas, faciKg: faci, note:"" };
  });
  return days;
}
DEFAULT.days = seedAugustDays();

let db = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return structuredClone(DEFAULT);
    return {...structuredClone(DEFAULT), ...JSON.parse(raw)};
  } catch { return structuredClone(DEFAULT); }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(db));
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "provende:save", data: db }, window.location.origin);
    }
  } catch {}
  toast("Enregistré");
}

function formulaCost(f) {
  let t = 0;
  Object.entries(f.mix||{}).forEach(([id, kg]) => {
    const m = db.materials.find(x => x.id===id);
    t += (kg||0) * (m?.unitPrice||0);
  });
  return t; // per 1000 kg
}
function formulaSum(f) {
  return Object.values(f.mix||{}).reduce((a,b)=>a+(Number(b)||0),0);
}
function dayTonnage(day) {
  if (!day) return 0;
  return Object.values(day.formulas||{}).reduce((a,b)=>a+(Number(b)||0),0);
}
function consumptionBetween(from, to) {
  const use = {};
  db.materials.forEach(m => use[m.id]=0);
  Object.entries(db.days).forEach(([date, day]) => {
    if (date < from || date > to) return;
    Object.entries(day.formulas||{}).forEach(([fid, tons]) => {
      const f = db.formulas.find(x=>x.id===fid);
      if (!f) return;
      Object.entries(f.mix||{}).forEach(([mid, kgPerT]) => {
        use[mid] = (use[mid]||0) + (kgPerT||0) * (tons||0);
      });
    });
  });
  return use;
}
function dailyNeed() {
  const days = Object.entries(db.days).filter(([,d]) => dayTonnage(d)>0);
  if (!days.length) return consumptionBetween("2000-01-01","2099-01-01");
  const use = consumptionBetween("2000-01-01","2099-01-01");
  const n = days.length;
  const avg = {};
  Object.keys(use).forEach(k => avg[k] = use[k]/n);
  return avg;
}
function statusOf(m, avg) {
  const need = avg[m.id]||0;
  const daysLeft = need>0 ? m.stock/need : (m.stock>0 ? 999 : 0);
  if (m.stock < 0 || (need>0 && daysLeft < 3)) return {label:"Rupture", cls:"bad", daysLeft};
  if (need>0 && daysLeft < (m.alertDays||15)) return {label:"À commander", cls:"warn", daysLeft};
  return {label:"Bon stock", cls:"ok", daysLeft};
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1600);
}

document.querySelectorAll(".nav-btn").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.querySelectorAll("[id^=view-]").forEach(v=>v.classList.add("hidden"));
  document.getElementById("view-"+b.dataset.view).classList.remove("hidden");
  render();
}));

function openModal(html) {
  document.getElementById("modal").innerHTML = html;
  document.getElementById("modalBg").classList.add("show");
}
document.getElementById("modalBg").addEventListener("click", e => {
  if (e.target.id==="modalBg") e.currentTarget.classList.remove("show");
});
window.closeModal = () => document.getElementById("modalBg").classList.remove("show");

function render() {
  const avg = dailyNeed();
  const alerts = db.materials.filter(m => statusOf(m, avg).cls!=="ok");
  document.getElementById("navStock").classList.toggle("warn", alerts.length>0);
  renderDash(avg, alerts);
  renderStock(avg);
  renderFormules();
  renderProd();
  renderEntrees();
  renderAliments();
  renderCouts();
  renderFournisseurs();
}

function renderDash(avg, alerts) {
  const valMP = db.materials.reduce((s,m)=>s+m.stock*m.unitPrice,0);
  const valAl = db.finished.reduce((s,a)=>s+a.qty*a.unitPrice,0);
  const tons = Object.values(db.days).reduce((s,d)=>s+dayTonnage(d),0);
  const [y,m] = db.month.split("-");
  document.getElementById("view-dash").innerHTML = `
    <div class="topbar">
      <div>
        <h1>Tableau de bord</h1>
        <p class="sub">État le plus récent : fin août 2026 · ${db.materials.length} matières · ${db.formulas.length} formules</p>
      </div>
      <div class="actions">
        <input type="month" value="${db.month}" onchange="db.month=this.value;save();render()" />
        <button class="btn ghost" onclick="exportJSON()">Exporter</button>
        <button class="btn ghost" onclick="document.getElementById('imp').click()">Importer</button>
        <input id="imp" type="file" accept="application/json" class="hidden" onchange="importJSON(event)" />
        <button class="btn danger" onclick="if(confirm('Réinitialiser aux données août 2026 ?')){localStorage.removeItem(KEY);db=load();render();toast('Réinitialisé')}">Reset</button>
      </div>
    </div>
    <div class="cards">
      <div class="card"><div class="k">Valeur matières</div><div class="v">${money(valMP)}</div></div>
      <div class="card"><div class="k">Valeur aliments</div><div class="v">${money(valAl)}</div></div>
      <div class="card"><div class="k">Grand total</div><div class="v">${money(valMP+valAl)}</div></div>
      <div class="card"><div class="k">Production du mois</div><div class="v">${fmt(tons,1)} t</div></div>
      <div class="card ${alerts.length?'alert':'ok'}"><div class="k">Alertes stock</div><div class="v">${alerts.length}</div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="k">À traiter en priorité</div>
      ${alerts.length? `<div class="table-wrap" style="margin-top:10px;box-shadow:none"><table>
        <thead><tr><th>Matière</th><th>Stock kg</th><th>Conso. moy. /j</th><th>Jours restants</th><th>Statut</th></tr></thead>
        <tbody>${alerts.map(m=>{const s=statusOf(m,avg);return `<tr>
          <td>${m.name}</td><td>${fmt(m.stock)}</td><td>${fmt(avg[m.id]||0)}</td>
          <td>${s.daysLeft>200?'—':fmt(s.daysLeft,1)}</td>
          <td><span class="badge ${s.cls}">${s.label}</span></td></tr>`}).join("")}</tbody></table></div>`
        : `<p class="sub">Tous les stocks sont sains.</p>`}
    </div>
    <div class="card">
      <div class="k">Comment ça marche</div>
      <p class="sub">1. Saisissez le calendrier (tonnes par formule et par jour).<br>
      2. Les sorties MP se calculent toutes seules (formule × tonnage).<br>
      3. Enregistrez les livraisons dans Entrées — le stock se met à jour.<br>
      4. Ajoutez une formule ou une matière quand vous voulez : tout est prévu.</p>
    </div>`;
}

function renderStock(avg) {
  document.getElementById("view-stock").innerHTML = `
    <div class="topbar"><div><h1>Matières premières</h1><p class="sub">Stock fin août 2026 · seuil d’alerte = 15 jours de conso.</p></div>
    <div class="actions"><button class="btn" onclick="editMaterial()">+ Matière</button>
    <button class="btn ghost" onclick="stockMove()">Mouvement manuel</button></div></div>
    <div class="filters"><input class="search" placeholder="Rechercher…" oninput="filterTable('stockT',this.value)"></div>
    <div class="table-wrap"><table id="stockT"><thead><tr>
      <th>Matière</th><th>Fournisseur</th><th>P.U.</th><th>Stock kg</th><th>Valeur</th><th>Conso/j</th><th>Jours</th><th>Statut</th><th></th>
    </tr></thead><tbody>
    ${db.materials.map(m=>{
      const s=statusOf(m,avg);
      return `<tr>
        <td><b>${m.name}</b></td><td>${m.supplier||"—"}</td>
        <td>${fmt(m.unitPrice,0)}</td><td>${fmt(m.stock)}</td>
        <td>${money(m.stock*m.unitPrice)}</td>
        <td>${fmt(avg[m.id]||0)}</td>
        <td>${s.daysLeft>200?'∞':fmt(s.daysLeft,1)}</td>
        <td><span class="badge ${s.cls}">${s.label}</span></td>
        <td class="row-actions"><button class="icon-btn" onclick="editMaterial('${m.id}')">Modifier</button>
        <button class="icon-btn" onclick="delMaterial('${m.id}')">×</button></td>
      </tr>`;
    }).join("")}
    </tbody></table></div>`;
}

window.filterTable = (id,q) => {
  q=q.toLowerCase();
  document.querySelectorAll("#"+id+" tbody tr").forEach(tr => tr.style.display = tr.textContent.toLowerCase().includes(q)?"":"none");
};
window.editMaterial = (id) => {
  const m = db.materials.find(x=>x.id===id) || {id:uid(), name:"", supplier:"", unitPrice:0, stock:0, alertDays:15};
  const isNew = !db.materials.find(x=>x.id===m.id);
  openModal(`<h2>${isNew?"Nouvelle matière":"Modifier"}</h2>
    <div class="grid-form">
      <div class="full"><label>Nom</label><input id="mn" value="${m.name||""}"></div>
      <div><label>Fournisseur</label><input id="ms" value="${m.supplier||""}"></div>
      <div><label>Prix unitaire (F/kg)</label><input id="mp" type="number" step="0.01" value="${m.unitPrice||0}"></div>
      <div><label>Stock (kg)</label><input id="mk" type="number" step="0.01" value="${m.stock||0}"></div>
      <div><label>Seuil d’alerte (jours)</label><input id="ma" type="number" value="${m.alertDays||15}"></div>
    </div>
    <div class="actions" style="margin-top:14px">
      <button class="btn" onclick="saveMaterial('${m.id}', ${isNew})">Enregistrer</button>
      <button class="btn ghost" onclick="closeModal()">Annuler</button>
    </div>`);
};
window.saveMaterial = (id, isNew) => {
  const obj = {id, name:mn.value, supplier:ms.value, unitPrice:+mp.value, stock:+mk.value, alertDays:+ma.value};
  if (isNew) db.materials.push(obj); else Object.assign(db.materials.find(x=>x.id===id), obj);
  save(); closeModal(); render();
};
window.delMaterial = (id) => {
  if (!confirm("Supprimer cette matière ?")) return;
  db.materials = db.materials.filter(x=>x.id!==id);
  save(); render();
};
window.stockMove = () => {
  openModal(`<h2>Mouvement de stock</h2>
    <div class="grid-form">
      <div class="full"><label>Matière</label><select id="mm">${db.materials.map(m=>`<option value="${m.id}">${m.name}</option>`).join("")}</select></div>
      <div><label>Type</label><select id="mt"><option value="in">Entrée (+)</option><option value="out">Sortie (−)</option><option value="adj">Ajustement (valeur absolue)</option></select></div>
      <div><label>Quantité kg</label><input id="mq" type="number" step="0.01"></div>
      <div class="full"><label>Note</label><input id="mnote" placeholder="Inventaire, casse, don…"></div>
    </div>
    <div class="actions" style="margin-top:14px"><button class="btn" onclick="applyMove()">Valider</button>
    <button class="btn ghost" onclick="closeModal()">Annuler</button></div>`);
};
window.applyMove = () => {
  const m = db.materials.find(x=>x.id===mm.value);
  const q = +mq.value;
  if (mt.value==="in") m.stock += q;
  else if (mt.value==="out") m.stock -= q;
  else m.stock = q;
  db.movements.push({id:uid(), date:new Date().toISOString().slice(0,10), materialId:m.id, type:mt.value, qty:q, note:mnote.value});
  save(); closeModal(); render();
};

function renderFormules() {
  document.getElementById("view-formules").innerHTML = `
    <div class="topbar"><div><h1>Formules</h1><p class="sub">Quantités en kg pour 1 tonne (1000 kg). Ajoutez A8, un concentrée poulette, etc. quand vous voulez.</p></div>
    <button class="btn" onclick="editFormula()">+ Formule</button></div>
    <div class="formula-grid">${db.formulas.map(f=>{
      const sum=formulaSum(f), cost=formulaCost(f);
      return `<div class="card fcard">
        <h3>${f.name}</h3>
        <div class="meta">${f.family} · ${f.id} · ${fmt(sum,1)} kg · ${fmt(cost/1000,1)} F/kg</div>
        <div class="bar"><i style="width:${Math.min(100,sum/10)}%;background:${f.color}"></i></div>
        <div class="actions" style="margin-top:10px">
          <button class="icon-btn" onclick="editFormula('${f.id}')">Éditer le mélange</button>
          <button class="icon-btn" onclick="dupFormula('${f.id}')">Dupliquer</button>
          <button class="icon-btn" onclick="delFormula('${f.id}')">Supprimer</button>
        </div>
      </div>`;
    }).join("")}</div>`;
}
window.editFormula = (id) => {
  const f = db.formulas.find(x=>x.id===id) || {id:"", family:"A · Poulette-Pondeuse", name:"", color:"#2f6b4f", mix:{}};
  const isNew = !db.formulas.find(x=>x.id===f.id);
  openModal(`<h2>${isNew?"Nouvelle formule":f.name}</h2>
    <div class="grid-form">
      <div><label>Code</label><input id="fid" value="${f.id}" ${isNew?"":"readonly"}></div>
      <div><label>Famille</label><input id="ffam" value="${f.family}"></div>
      <div class="full"><label>Nom</label><input id="fname" value="${f.name}"></div>
      <div><label>Couleur</label><input id="fcol" type="color" value="${f.color||"#2f6b4f"}"></div>
    </div>
    <p class="sub">Kg par tonne — le total devrait faire 1000</p>
    <div class="table-wrap" style="max-height:40vh"><table><thead><tr><th>Matière</th><th>kg / t</th></tr></thead><tbody>
    ${db.materials.map(m=>`<tr><td>${m.name}</td><td><input data-mid="${m.id}" type="number" step="0.1" value="${f.mix[m.id]||0}" style="width:110px"></td></tr>`).join("")}
    </tbody></table></div>
    <div class="actions" style="margin-top:14px"><button class="btn" onclick="saveFormula(${isNew})">Enregistrer</button>
    <button class="btn ghost" onclick="closeModal()">Annuler</button></div>`);
};
window.saveFormula = (isNew) => {
  const mix = {};
  document.querySelectorAll("[data-mid]").forEach(i => mix[i.dataset.mid] = +i.value);
  const obj = {id:fid.value.trim(), family:ffam.value, name:fname.value, color:fcol.value, mix};
  if (!obj.id) return toast("Code obligatoire");
  if (isNew) {
    if (db.formulas.find(x=>x.id===obj.id)) return toast("Code déjà utilisé");
    db.formulas.push(obj);
  } else Object.assign(db.formulas.find(x=>x.id===obj.id), obj);
  save(); closeModal(); render();
};
window.dupFormula = (id) => {
  const f = structuredClone(db.formulas.find(x=>x.id===id));
  f.id = f.id + "_copy"; f.name = f.name + " (copie)";
  db.formulas.push(f); save(); render();
};
window.delFormula = (id) => {
  if (!confirm("Supprimer la formule "+id+" ?")) return;
  db.formulas = db.formulas.filter(x=>x.id!==id); save(); render();
};

function monthDays() {
  const [y,m] = db.month.split("-").map(Number);
  const last = new Date(y,m,0).getDate();
  const firstDow = new Date(y,m-1,1).getDay(); // 0 dim
  return {y,m,last,firstDow};
}
function renderProd() {
  const {y,m,last,firstDow} = monthDays();
  const startPad = (firstDow+6)%7; // lundi
  const cells = [];
  for (let i=0;i<startPad;i++) cells.push(`<div class="day empty"></div>`);
  for (let d=1;d<=last;d++) {
    const date = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const day = db.days[date];
    const t = dayTonnage(day);
    const pills = day ? Object.entries(day.formulas||{}).filter(([,v])=>v).map(([k,v])=>`<span class="pill">${k} ${v}t</span>`).join("") : "";
    cells.push(`<div class="day" onclick="editDay('${date}')"><div class="n">${d}</div>
      <div class="t">${t?fmt(t,1)+' t':''}${day?.faciKg? ' · FACI '+day.faciKg+' kg':''}</div>${pills}</div>`);
  }
  const total = Object.entries(db.days).filter(([dt])=>dt.startsWith(db.month)).reduce((s,[,d])=>s+dayTonnage(d),0);
  document.getElementById("view-prod").innerHTML = `
    <div class="topbar"><div><h1>Calendrier de production</h1><p class="sub">Cliquez un jour pour saisir les tonnes par formule. Total mois : <b>${fmt(total,1)} t</b></p></div>
    <div class="actions"><input type="month" value="${db.month}" onchange="db.month=this.value;save();render()">
    <button class="btn ghost" onclick="applyProdToStock()">Déduire le mois du stock</button></div></div>
    <div class="cal" style="margin-bottom:8px">${["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(x=>`<div class="sub" style="text-align:center">${x}</div>`).join("")}</div>
    <div class="cal">${cells.join("")}</div>`;
}
window.editDay = (date) => {
  const day = db.days[date] || {formulas:{}, faciKg:0, note:""};
  openModal(`<h2>Production ${date}</h2>
    <p class="sub">Tonnes par formule (0 = rien)</p>
    <div class="grid-form">
      ${db.formulas.map(f=>`<div><label>${f.id} — ${f.name}</label>
        <input data-fid="${f.id}" type="number" step="0.1" value="${day.formulas[f.id]||0}"></div>`).join("")}
      <div><label>Maïs FACI (kg, hors formule)</label><input id="faci" type="number" value="${day.faciKg||0}"></div>
      <div class="full"><label>Note</label><input id="dnote" value="${day.note||""}"></div>
    </div>
    <div class="actions" style="margin-top:14px"><button class="btn" onclick="saveDay('${date}')">Enregistrer</button>
    <button class="btn ghost" onclick="closeModal()">Annuler</button></div>`);
};
window.saveDay = (date) => {
  const formulas = {};
  document.querySelectorAll("[data-fid]").forEach(i => { if (+i.value) formulas[i.dataset.fid]=+i.value; });
  db.days[date] = {formulas, faciKg:+faci.value||0, note:dnote.value};
  if (!Object.keys(formulas).length && !db.days[date].faciKg) delete db.days[date];
  save(); closeModal(); render();
};
window.applyProdToStock = () => {
  if (!confirm("Soustraire la consommation du mois affiché des stocks MP ? À faire une fois, en fin de mois.")) return;
  const [y,m] = db.month.split("-");
  const last = new Date(+y,+m,0).toISOString().slice(0,10);
  const use = consumptionBetween(db.month+"-01", last);
  db.materials.forEach(mat => { mat.stock -= (use[mat.id]||0); });
  save(); render();
};

function renderEntrees() {
  document.getElementById("view-entrees").innerHTML = `
    <div class="topbar"><div><h1>Entrées / commandes</h1><p class="sub">Livraisons du mois. Enregistrer une entrée augmente le stock.</p></div>
    <button class="btn" onclick="editReceipt()">+ Entrée</button></div>
    <div class="table-wrap"><table><thead><tr><th>Date</th><th>Matière</th><th>Qté kg</th><th>Note</th><th></th></tr></thead><tbody>
    ${[...db.receipts].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>{
      const m=db.materials.find(x=>x.id===r.materialId);
      return `<tr><td>${r.date}</td><td>${m?m.name:r.materialId}</td><td>${fmt(r.qty)}</td><td>${r.note||""}</td>
        <td><button class="icon-btn" onclick="delReceipt('${r.id}')">×</button></td></tr>`;
    }).join("")}
    </tbody></table></div>`;
}
window.editReceipt = () => {
  const today = new Date().toISOString().slice(0,10);
  openModal(`<h2>Nouvelle entrée</h2><div class="grid-form">
    <div><label>Date</label><input id="rd" type="date" value="${db.month}-01"></div>
    <div><label>Matière</label><select id="rm">${db.materials.map(m=>`<option value="${m.id}">${m.name}</option>`).join("")}</select></div>
    <div><label>Quantité kg</label><input id="rq" type="number" step="0.01"></div>
    <div><label>Note</label><input id="rn"></div>
  </div>
  <label style="display:flex;gap:8px;margin:12px 0;font-size:.9rem"><input type="checkbox" id="radd" checked> Ajouter au stock maintenant</label>
  <div class="actions"><button class="btn" onclick="saveReceipt()">Enregistrer</button>
  <button class="btn ghost" onclick="closeModal()">Annuler</button></div>`);
};
window.saveReceipt = () => {
  const rec = {id:uid(), date:rd.value, materialId:rm.value, qty:+rq.value, note:rn.value};
  db.receipts.push(rec);
  if (radd.checked) {
    const m = db.materials.find(x=>x.id===rec.materialId);
    if (m) m.stock += rec.qty;
  }
  save(); closeModal(); render();
};
window.delReceipt = (id) => {
  const r = db.receipts.find(x=>x.id===id);
  if (confirm("Supprimer cette entrée ? (le stock n’est pas recalé automatiquement)")) {
    db.receipts = db.receipts.filter(x=>x.id!==id); save(); render();
  }
};

function renderAliments() {
  const tot = db.finished.reduce((s,a)=>s+a.qty*a.unitPrice,0);
  document.getElementById("view-aliments").innerHTML = `
    <div class="topbar"><div><h1>Aliments finis</h1><p class="sub">Stock sac / vrac valorisé · ${money(tot)}</p></div>
    <button class="btn" onclick="editAliment()">+ Aliment</button></div>
    <div class="table-wrap"><table><thead><tr><th>Produit</th><th>Qté</th><th>P.U.</th><th>Valeur</th><th></th></tr></thead><tbody>
    ${db.finished.map(a=>`<tr><td>${a.name}</td><td>${fmt(a.qty,0)}</td><td>${fmt(a.unitPrice,0)}</td>
      <td>${money(a.qty*a.unitPrice)}</td>
      <td><button class="icon-btn" onclick="editAliment('${a.id}')">Modifier</button>
      <button class="icon-btn" onclick="db.finished=db.finished.filter(x=>x.id!=='${a.id}');save();render()">×</button></td></tr>`).join("")}
    </tbody></table></div>`;
}
window.editAliment = (id) => {
  const a = db.finished.find(x=>x.id===id) || {id:uid(), name:"", qty:0, unitPrice:0};
  const isNew = !db.finished.find(x=>x.id===a.id);
  openModal(`<h2>Aliment</h2><div class="grid-form">
    <div class="full"><label>Nom</label><input id="an" value="${a.name}"></div>
    <div><label>Quantité</label><input id="aq" type="number" value="${a.qty}"></div>
    <div><label>Prix unitaire</label><input id="ap" type="number" value="${a.unitPrice}"></div>
  </div><div class="actions" style="margin-top:12px"><button class="btn" onclick="
    const o={id:'${a.id}',name:an.value,qty:+aq.value,unitPrice:+ap.value};
    if(${isNew}) db.finished.push(o); else Object.assign(db.finished.find(x=>x.id==='${a.id}'),o);
    save();closeModal();render();">Enregistrer</button>
    <button class="btn ghost" onclick="closeModal()">Annuler</button></div>`);
};

function renderCouts() {
  document.getElementById("view-couts").innerHTML = `
    <div class="topbar"><div><h1>Coûts des formules</h1><p class="sub">Recalculés à partir des P.U. actuels · prêt si un prix change</p></div></div>
    <div class="table-wrap"><table><thead><tr><th>Formule</th><th>Somme kg</th><th>Coût / t</th><th>Prix / kg</th><th>½ tonne</th></tr></thead><tbody>
    ${db.formulas.map(f=>{
      const c=formulaCost(f), s=formulaSum(f);
      return `<tr><td><b>${f.id}</b> ${f.name}</td><td>${fmt(s,1)}</td><td>${money(c)}</td><td>${fmt(c/1000,2)}</td><td>${money(c/2)}</td></tr>`;
    }).join("")}
    </tbody></table></div>`;
}

function renderFournisseurs() {
  const map = {};
  db.materials.forEach(m => {
    const k = m.supplier || "—";
    if (!map[k]) map[k]={name:k, items:[], value:0};
    map[k].items.push(m);
    map[k].value += m.stock * m.unitPrice;
  });
  document.getElementById("view-fournisseurs").innerHTML = `
    <div class="topbar"><div><h1>Fournisseurs</h1><p class="sub">Dérivé des matières — changez le fournisseur sur une MP pour l’ajouter ici.</p></div></div>
    <div class="formula-grid">${Object.values(map).map(s=>`
      <div class="card"><h3 style="margin:0 0 6px;font-size:1.05rem">${s.name}</h3>
        <div class="sub">${s.items.length} références · ${money(s.value)}</div>
        <ul>${s.items.map(i=>`<li>${i.name} — ${fmt(i.stock)} kg</li>`).join("")}</ul>
      </div>`).join("")}</div>`;
}

window.exportJSON = () => {
  const blob = new Blob([JSON.stringify(db,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "provende-"+db.month+".json";
  a.click();
};
window.importJSON = (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { db = {...structuredClone(DEFAULT), ...JSON.parse(reader.result)}; save(); render(); };
  reader.readAsText(file);
};

render();
</script>
</body>
</html>
