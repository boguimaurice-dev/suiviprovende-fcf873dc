<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Provende — Inventaire &amp; Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f4f1ea;
  --paper: #fffdf8;
  --ink: #1c1915;
  --muted: #6b6458;
  --line: #e6dfd2;
  --accent: #2f6b4f;
  --accent-2: #c45c26;
  --warn: #b45309;
  --danger: #b42318;
  --ok: #177245;
  --chip: #eef6f1;
  --shadow: 0 10px 40px rgba(28,25,21,.08);
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; }
button, input, select, textarea { font-family: inherit; }
.app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
.side {
  background: #1c1915; color: #f4f1ea; padding: 28px 20px; display: flex; flex-direction: column; gap: 8px;
  position: sticky; top: 0; height: 100vh;
}
.brand { font-family: Fraunces, serif; font-size: 1.45rem; margin: 0 0 4px; letter-spacing: -.02em; }
.brand small { display: block; font-family: "DM Sans", sans-serif; font-size: .72rem; color: #c9c0b3; font-weight: 400; margin-top: 4px; }
.nav-btn {
  background: transparent; border: 0; color: #e8e0d4; text-align: left; padding: 11px 12px; border-radius: 10px;
  cursor: pointer; font-size: .92rem; display: flex; justify-content: space-between; align-items: center;
}
.nav-btn:hover, .nav-btn.active { background: #2a2620; color: #fff; }
.nav-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); display: none; }
.nav-btn.warn .dot { display: inline-block; }
.side-foot { margin-top: auto; font-size: .75rem; color: #9a9186; line-height: 1.4; }
.main { padding: 28px 32px 80px; max-width: 1400px; }
.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
h1 { font-family: Fraunces, serif; font-size: 1.8rem; margin: 0; }
.sub { color: var(--muted); margin: 6px 0 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 0; background: var(--accent); color: #fff; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 600;
}
.btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.btn.warn { background: var(--accent-2); }
.btn.danger { background: var(--danger); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 22px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.card .k { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.card .v { font-size: 1.35rem; font-weight: 700; margin-top: 6px; }
.card.alert { border-color: #f0c4b8; background: #fff6f3; }
.card.ok { border-color: #c9e6d4; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--paper); }
.table-wrap { overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: .72rem; font-weight: 600; }
.badge.ok { background: #e5f6ea; color: var(--ok); }
.badge.warn { background: #fff3d6; color: var(--warn); }
.badge.bad { background: #fde8e6; color: var(--danger); }
.row-actions { display: flex; gap: 6px; }
.icon-btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 8px; cursor: pointer; font-size: .78rem; }
.modal-bg { position: fixed; inset: 0; background: rgba(28,25,21,.45); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.modal-bg.show { display: flex; }
.modal { background: var(--paper); border-radius: 18px; width: min(720px, 100%); max-height: 90vh; overflow: auto; padding: 22px; }
.modal h2 { font-family: Fraunces, serif; margin: 0 0 14px; }
.grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-form label, .full label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
.grid-form input, .grid-form select, .full input, .full textarea, .full select {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
}
.full { grid-column: 1 / -1; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.day {
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px; min-height: 110px; padding: 8px; cursor: pointer;
}
.day:hover { border-color: var(--accent); }
.day.empty { background: transparent; border: 0; cursor: default; }
.day .n { font-weight: 700; }
.day .t { font-size: .75rem; color: var(--muted); margin-top: 4px; }
.pill { font-size: .68rem; background: var(--chip); color: var(--accent); padding: 2px 6px; border-radius: 6px; display: inline-block; margin: 2px 2px 0 0; }
.filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.search { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); min-width: 220px; }
.hidden { display: none !important; }
.formula-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.fcard h3 { margin: 0 0 4px; font-size: 1rem; }
.fcard .meta { color: var(--muted); font-size: .8rem; margin-bottom: 10px; }
.bar { height: 6px; background: #eee8dc; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.toast { position: fixed; bottom: 20px; right: 20px; background: #1c1915; color: #fff; padding: 12px 16px; border-radius: 12px; display: none; z-index: 30; }
.toast.show { display: block; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: relative; height: auto; flex-direction: row; flex-wrap: wrap; max-width:100vw; }
  .side-foot { display: none; }
  .main { padding: 16px; min-width:0; max-width:100vw; overflow-x:hidden; }
  .nav-btn { flex: 1 1 145px; min-width:0; }
  .grid-form { grid-template-columns: 1fr; }
  .cal { grid-template-columns: repeat(2, 1fr); }
  .topbar { flex-direction: column; align-items: stretch; gap: 10px; }
  .topbar .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .topbar .actions > * { flex: 1 1 auto; min-width: 0; }
  .cards { grid-template-columns: repeat(2, minmax(0,1fr)) !important; gap: 8px; }
  .cards .card { padding: 12px; min-width: 0; }
  .cards .v { font-size: 1.05rem; word-break: break-word; }
  .search { min-width: 0; width: 100%; }
  th, td { padding: 7px 6px; font-size: .8rem; }
  .hide-m { display: none; }
  .alert-table table { table-layout: auto; }
}
@media (min-width: 861px) { .show-m { display: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div>
      <p class="brand">Provende<small>Inventaire · Formules · Production</small></p>
    </div>
    <button class="nav-btn active" data-view="dash">Tableau de bord</button>
    <button class="nav-btn" data-view="stock" id="navStock">Matières premières <span class="dot"></span></button>
    <button class="nav-btn" data-view="formules">Formules</button>
    <button class="nav-btn" data-view="prod">Calendrier production</button>
    <button class="nav-btn" data-view="entrees">Entrées / commandes</button>
    <button class="nav-btn" data-view="aliments">Aliments finis</button>
    <button class="nav-btn" data-view="couts">Coûts &amp; prix</button>
    <button class="nav-btn" data-view="fournisseurs">Fournisseurs</button>
    <button class="nav-btn" data-view="historique">Historique &amp; arrangements</button>
    <button class="btn" id="btnScan" style="margin-top:8px">Scanner une fiche du jour</button>
    <button class="btn ghost" id="btnChat" style="margin-top:6px">Dialoguer avec l'app</button>

    <div class="side-foot">Vos données sont privées et liées à votre compte.</div>
  </aside>
  <main class="main">
    <div id="view-dash"></div>
    <div id="view-stock" class="hidden"></div>
    <div id="view-formules" class="hidden"></div>
    <div id="view-prod" class="hidden"></div>
    <div id="view-entrees" class="hidden"></div>
    <div id="view-aliments" class="hidden"></div>
    <div id="view-couts" class="hidden"></div>
    <div id="view-fournisseurs" class="hidden"></div>
    <div id="view-historique" class="hidden"></div>
  </main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY = "provende-app-v1";
const fmt = (n, d=2) => (Number(n)||0).toLocaleString("fr-FR", {minimumFractionDigits:d, maximumFractionDigits:d});
const money = n => fmt(n,0) + " F";
const uid = () => Math.random().toString(36).slice(2,9);

const DEFAULT = {
  month: new Date().toISOString().slice(0,7),
  materials: [],
  formulas: [],
  days: {},
  receipts: [],
  finished: [],
  movements: [],
  sales: [],
  suppliers: [],
  orders: []
};

const EMBEDDED = window.parent && window.parent !== window;
let db = EMBEDDED ? structuredClone(DEFAULT) : load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return structuredClone(DEFAULT);
    return {...structuredClone(DEFAULT), ...JSON.parse(raw)};
  } catch { return structuredClone(DEFAULT); }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(db));
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "provende:save", data: db }, window.location.origin);
    }
  } catch {}
  toast("Enregistré");
}

function formulaCost(f) {
  let t = 0;
  Object.entries(f.mix||{}).forEach(([id, kg]) => {
    const m = db.materials.find(x => x.id===id);
    t += (kg||0) * (m?.unitPrice||0);
  });
  return t; // per 1000 kg
}
function formulaSum(f) {
  return Object.values(f.mix||{}).reduce((a,b)=>a+(Number(b)||0),0);
}
function dayTonnage(day) {
  if (!day) return 0;
  return Object.values(day.formulas||{}).reduce((a,b)=>a+(Number(b)||0),0);
}
function consumptionBetween(from, to) {
  const use = {};
  db.materials.forEach(m => use[m.id]=0);
  Object.entries(db.days).forEach(([date, day]) => {
    if (date < from || date > to) return;
    Object.entries(day.formulas||{}).forEach(([fid, tons]) => {
      const f = db.formulas.find(x=>x.id===fid);
      if (!f) return;
      Object.entries(f.mix||{}).forEach(([mid, kgPerT]) => {
        use[mid] = (use[mid]||0) + (kgPerT||0) * (tons||0);
      });
    });
  });
  return use;
}
function dailyNeed() {
  const days = Object.entries(db.days).filter(([,d]) => dayTonnage(d)>0);
  if (!days.length) return consumptionBetween("2000-01-01","2099-01-01");
  const use = consumptionBetween("2000-01-01","2099-01-01");
  const n = days.length;
  const avg = {};
  Object.keys(use).forEach(k => avg[k] = use[k]/n);
  return avg;
}
function statusOf(m, avg) {
  const need = avg[m.id]||0;
  const daysLeft = need>0 ? m.stock/need : (m.stock>0 ? 999 : 0);
  if (m.stock < 0 || (need>0 && daysLeft < 3)) return {label:"Rupture", cls:"bad", daysLeft};
  if (need>0 && daysLeft < (m.alertDays||15)) return {label:"À commander", cls:"warn", daysLeft};
  return {label:"Bon stock", cls:"ok", daysLeft};
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1600);
}

document.querySelectorAll(".nav-btn").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.querySelectorAll("[id^=view-]").forEach(v=>v.classList.add("hidden"));
  document.getElementById("view-"+b.dataset.view).classList.remove("hidden");
  render();
}));

function openModal(html) {
  document.getElementById("modal").innerHTML = html;
  document.getElementById("modalBg").classList.add("show");
}
document.getElementById("modalBg").addEventListener("click", e => {
  if (e.target.id==="modalBg") e.currentTarget.classList.remove("show");
});
window.closeModal = () => document.getElementById("modalBg").classList.remove("show");

function render() {
  const avg = dailyNeed();
  const alerts = db.materials.filter(m => statusOf(m, avg).cls!=="ok");
  document.getElementById("navStock").classList.toggle("warn", alerts.length>0);
  renderDash(avg, alerts);
  renderStock(avg);
  renderFormules();
  renderProd();
  renderEntrees();
  renderAliments();
  renderCouts();
  renderFournisseurs();
  if (window.renderHistorique) window.renderHistorique();
}

function renderDash(avg, alerts) {
  const valMP = db.materials.reduce((s,m)=>s+m.stock*m.unitPrice,0);
  const valAl = db.finished.reduce((s,a)=>s+a.qty*a.unitPrice,0);
  const tons = Object.values(db.days).reduce((s,d)=>s+dayTonnage(d),0);
  const [y,m] = db.month.split("-");
  document.getElementById("view-dash").innerHTML = `
    <div class="topbar">
      <div>
        <h1>Tableau de bord</h1>
        <p class="sub">État actuel · ${db.materials.length} matières · ${db.formulas.length} formules</p>
      </div>
      <div class="actions">
        <input type="month" value="${db.month}" onchange="db.month=this.value;save();render()" />
        <button class="btn ghost" onclick="openExport()">Exporter…</button>
        <button class="btn ghost" onclick="openImport()">Importer…</button>
        <button class="btn" onclick="openBackups()">Sauvegarder / Restaurer</button>
        <button class="btn danger" onclick="safeReset()">Tout réinitialiser</button>
      </div>
    </div>
    <div class="cards">
      <div class="card"><div class="k">Valeur matières</div><div class="v">${money(valMP)}</div></div>
      <div class="card"><div class="k">Valeur aliments</div><div class="v">${money(valAl)}</div></div>
      <div class="card"><div class="k">Grand total</div><div class="v">${money(valMP+valAl)}</div></div>
      <div class="card"><div class="k">Production du mois</div><div class="v">${fmt(tons,1)} t</div></div>
      <div class="card ${alerts.length?'alert':'ok'}"><div class="k">Alertes stock</div><div class="v">${alerts.length}</div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="k">À traiter en priorité</div>
      ${alerts.length? `<div class="table-wrap alert-table" style="margin-top:10px;box-shadow:none"><table>
        <thead><tr><th>Matière</th><th>Stock kg</th><th class="hide-m">Conso. moy. /j</th><th class="hide-m">Jours restants</th><th>Statut</th></tr></thead>
        <tbody>${alerts.map(m=>{const s=statusOf(m,avg);const dl=s.daysLeft>200?'—':fmt(s.daysLeft,1);return `<tr>
          <td><b>${m.name}</b><div class="sub show-m" style="font-size:.72rem">${fmt(avg[m.id]||0)} kg/j · ${dl} j</div></td><td>${fmt(m.stock)}</td><td class="hide-m">${fmt(avg[m.id]||0)}</td>
          <td class="hide-m">${dl}</td>
          <td><span class="badge ${s.cls}" role="button" tabindex="0" style="cursor:pointer" title="Cliquer pour commander" onclick="orderFromAlert('${m.id}')">${s.label} ›</span></td></tr>`}).join("")}</tbody></table></div>`
        : `<p class="sub">Tous les stocks sont sains.</p>`}
    </div>
    <iframe id="analyticsFrame" src="/analyse" title="Analyse & Graphiques" style="width:100%;height:1100px;border:0;display:block"></iframe>`;
}

function renderStock(avg) {
  document.getElementById("view-stock").innerHTML = `
    <div class="topbar"><div><h1>Matières premières</h1><p class="sub">Stock actuel · seuil d’alerte = 15 jours de conso.</p></div>
    <div class="actions"><button class="btn" onclick="editMaterial()">+ Matière</button>
    <button class="btn ghost" onclick="stockMove()">Mouvement manuel</button>
    <button class="btn warn" onclick="stockAdjust()">Arrangement (stock réel)</button></div></div>
    <div class="filters"><input class="search" placeholder="Rechercher…" oninput="filterTable('stockT',this.value)"></div>
    <div class="table-wrap"><table id="stockT"><thead><tr>
      <th>Matière</th><th>Fournisseur</th><th>P.U.</th><th>Stock kg</th><th>Valeur</th><th>Conso/j</th><th>Jours</th><th>Statut</th><th></th>
    </tr></thead><tbody>
    ${db.materials.map(m=>{
      const s=statusOf(m,avg);
      return `<tr>
        <td><b>${m.name}</b></td><td>${m.supplier||"—"}</td>
        <td>${fmt(m.unitPrice,0)}</td><td>${fmt(m.stock)}</td>
        <td>${money(m.stock*m.unitPrice)}</td>
        <td>${fmt(avg[m.id]||0)}</td>
        <td>${s.daysLeft>200?'∞':fmt(s.daysLeft,1)}</td>
        <td><span class="badge ${s.cls}">${s.label}</span></td>
        <td class="row-actions"><button class="icon-btn" onclick="editMaterial('${m.id}')">Modifier</button>
        <button class="icon-btn" onclick="delMaterial('${m.id}')">×</button></td>
      </tr>`;
    }).join("")}
    </tbody></table></div>`;
}

window.filterTable = (id,q) => {
  q=q.toLowerCase();
  document.querySelectorAll("#"+id+" tbody tr").forEach(tr => tr.style.display = tr.textContent.toLowerCase().includes(q)?"":"none");
};
window.editMaterial = (id) => {
  const m = db.materials.find(x=>x.id===id) || {id:uid(), name:"", supplier:"", unitPrice:0, stock:0, alertDays:15};
  const isNew = !db.materials.find(x=>x.id===m.id);
  openModal(`<h2>${isNew?"Nouvelle matière":"Modifier"}</h2>
    <div class="grid-form">
      <div class="full"><label>Nom</label><input id="mn" value="${m.name||""}"></div>
      <div><label>Fournisseur</label><input id="ms" value="${m.supplier||""}"></div>
      <div><label>Prix unitaire (F/kg)</label><input id="mp" type="number" step="0.01" value="${m.unitPrice||0}"></div>
      <div><label>Stock (kg)</label><input id="mk" type="number" step="0.01" value="${m.stock||0}"></div>
      <div><label>Seuil d’alerte (jours)</label><input id="ma" type="number" value="${m.alertDays||15}"></div>
    </div>
    <div class="actions" style="margin-top:14px">
      <button class="btn" onclick="saveMaterial('${m.id}', ${isNew})">Enregistrer</button>
      <button class="btn ghost" onclick="closeModal()">Annuler</button>
    </div>`);
};
window.saveMaterial = (id, isNew) => {
  const obj = {id, name:mn.value, supplier:ms.value, unitPrice:+mp.value, stock:+mk.value, alertDays:+ma.value};
  if (isNew) db.materials.push(obj); else Object.assign(db.materials.find(x=>x.id===id), obj);
  save(); closeModal(); render();
};
window.delMaterial = (id) => {
  if (!confirm("Supprimer cette matière ?")) return;
  db.materials = db.materials.filter(x=>x.id!==id);
  save(); render();
};
window.stockMove = () => {
  openModal(`<h2>Mouvement de stock</h2>
    <div class="grid-form">
      <div class="full"><label>Matière</label><select id="mm">${db.materials.map(m=>`<option value="${m.id}">${m.name}</option>`).join("")}</select></div>
      <div><label>Type</label><select id="mt"><option value="in">Entrée (+)</option><option value="out">Sortie (−)</option><option value="adj">Ajustement (valeur absolue)</option></select></div>
      <div><label>Quantité kg</label><input id="mq" type="number" step="0.01"></div>
      <div class="full"><label>Note</label><input id="mnote" placeholder="Inventaire, casse, don…"></div>
    </div>
    <div class="actions" style="margin-top:14px"><button class="btn" onclick="applyMove()">Valider</button>
    <button class="btn ghost" onclick="closeModal()">Annuler</button></div>`);
};
window.applyMove = () => {
  const m = db.materials.find(x=>x.id===mm.value);
  const q = +mq.value;
  const before = m.stock;
  if (mt.value==="in") m.stock = (+m.stock||0) + q;
  else if (mt.value==="out") m.stock = (+m.stock||0) - q;
  else m.stock = q;
  db.movements.push({id:uid(), date:new Date().toISOString().slice(0,10), materialId:m.id, type:mt.value, qty:q, before, after:m.stock, note:mnote.value});
  save(); closeModal(); render();
};
/* Arrangement : mise à niveau du stock virtuel sur le stock réel compté */
window.stockAdjust = (id) => {
  if (!db.materials.length) return toast("Ajoutez d'abord une matière");
  openModal(`<h2>Arrangement de stock</h2>
    <p class="sub">Saisissez la quantité réellement comptée en magasin : l'écart avec le stock de l'app est enregistré dans l'historique.</p>
    <div class="grid-form">
      <div class="full"><label>Matière</label><select id="am">
        ${db.materials.map(m=>`<option value="${m.id}" ${id===m.id?"selected":""} data-stock="${m.stock}">${m.name} — ${fmt(m.stock)} kg en base</option>`).join("")}</select></div>
      <div><label>Stock réel compté (kg)</label><input id="areal" type="number" step="0.01"></div>
      <div><label>Date</label><input id="adate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="full"><label>Motif</label><input id="anote" placeholder="Inventaire physique, casse, humidité, erreur de saisie…"></div>
    </div>
    <div class="actions" style="margin-top:14px"><button class="btn" onclick="applyAdjust()">Enregistrer l'arrangement</button>

function monthDays() {

function renderProd() {
  const {y,m,last,firstDow} = monthDays();
  const startPad = (firstDow+6)%7; // lundi
  const cells = [];
  for (let i=0;i<startPad;i++) cells.push(`<div class="day empty"></div>`);
  for (let d=1;d<=last;d++) {
    const date = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const day = db.days[date];
    const t = dayTonnage(day);
    const pills = day ? Object.entries(day.formulas||{}).filter(([,v])=>v).map(([k,v])=>`<span class="pill">${k} ${v}t</span>`).join("") : "";
    cells.push(`<div class="day" onclick="editDay('${date}')"><div class="n">${d}</div>

  }
  const total = Object.entries(db.days).filter(([dt])=>dt.startsWith(db.month)).reduce((s,[,d])=>s+dayTonnage(d),0);

  </div>

window.saveReceipt = (id, isNew) => {
  const next = {id, date:rd.value, materialId:rm.value, qty:+rq.value||0, note:rn.value};
  if (isNew) {
    db.receipts.push(next);
    if (radd.checked) {
      const m = db.materials.find(x=>x.id===next.materialId);
      if (m) m.stock = (+m.stock||0) + next.qty;
    }
  } else {
    const prev = db.receipts.find(x=>x.id===id);
    const old = {materialId:prev.materialId, qty:+prev.qty||0};
    Object.assign(prev, next);
    if (radd.checked) {
      if (old.materialId === next.materialId) {
        const m = db.materials.find(x=>x.id===next.materialId);
        if (m) m.stock = (+m.stock||0) + (next.qty - old.qty);
      } else {
        const mo = db.materials.find(x=>x.id===old.materialId);
        if (mo) mo.stock = (+mo.stock||0) - old.qty;
        const mn = db.materials.find(x=>x.id===next.materialId);
        if (mn) mn.stock = (+mn.stock||0) + next.qty;
      }
    }
  }
  save(); closeModal(); render();
};
window.delReceipt = (id) => {
  const r = db.receipts.find(x=>x.id===id);
  if (!r) return;
  if (!confirm("Supprimer cette entrée ?")) return;
  if (confirm("Retirer aussi cette quantité du stock ?")) {
    const m = db.materials.find(x=>x.id===r.materialId);
    if (m) m.stock = (+m.stock||0) - (+r.qty||0);
  }
  db.receipts = db.receipts.filter(x=>x.id!==id); save(); render();
};

/* ===== Commandes fournisseurs ===== */
function orderTotal(o) {
  return (o.lines||[]).reduce((t,l)=>t+(+l.qty||0)*(+l.unitPrice||0),0);
}
function orderText(o) {
  const lines = (o.lines||[]).map(l=>{
    const m = db.materials.find(x=>x.id===l.materialId);
    return "- " + (m?m.name:l.materialId) + " : " + fmt(l.qty) + " kg";
  }).join("\n");
  return "Bonjour, commande du " + o.date + " :\n" + lines +
    (o.expected ? "\nLivraison souhaitée : " + o.expected : "") +
    (o.note ? "\nNote : " + o.note : "") + "\nMerci.";
}
window.newOrder = (supplierId) => window.editOrder(null, supplierId);
window.orderFromAlert = (matId) => {
  const avg = dailyNeed();
  const ids = matId ? [matId] : db.materials.filter(m=>statusOf(m,avg).cls!=="ok").map(m=>m.id);
  const lines = ids.map(id=>{
    const m = db.materials.find(x=>x.id===id); if(!m) return null;
    const target = (avg[id]||0) * (m.alertDays||15) * 2;
    const qty = Math.max(0, Math.ceil((target - (+m.stock||0))/10)*10);
    return {materialId:id, qty, unitPrice:+m.unitPrice||0};
  }).filter(Boolean);
  const first = db.materials.find(m=>m.id===ids[0]);
  const sup = first && first.supplier ? supplierList().find(x=>norm(x.name)===norm(first.supplier)) : null;
  window.editOrder(null, sup?sup.id:"", lines);
};
window.editOrder = (id, supplierId, prefill) => {
  const existing = (db.orders||[]).find(x=>x.id===id);
  const o = existing || {id:uid(), date:new Date().toISOString().slice(0,10), supplierId:supplierId||"", expected:"", note:"", status:"brouillon", lines:prefill||[]};
  const list = supplierList();

  const priceOf = (mid)=> {

    return db.materials.find(m=>m.id===mid)?.unitPrice || 0;

    <div><label>Date</label><input id="od" type="date" value="${o.date}"></div>

    <td><input data-oq="${m.id}" type="number" step="0.01" value="${qtyOf(m.id)}" style="max-width:110px"></td>

window.saveOrder = (id, isNew) => {
  const lines = [];
  document.querySelectorAll("[data-oq]").forEach(i => {
    const qty = +i.value;
    if (!qty) return;

    lines.push({materialId:mid, qty, unitPrice:+(p?p.value:0)||0});
  });
  if (!os.value) { toast("Choisissez un fournisseur"); return; }
  if (!lines.length) { toast("Ajoutez au moins une quantité"); return; }
  const o = {id, date:od.value, supplierId:os.value, expected:oe.value, note:on.value.trim(), status:ost.value, lines};
  db.orders = db.orders || [];
  if (isNew) db.orders.push(o); else Object.assign(db.orders.find(x=>x.id===id), o);
  save(); closeModal(); render();
};
window.delOrder = (id) => {

  db.orders = (db.orders||[]).filter(x=>x.id!==id);

};
const pendingOrderLinks = {};
window.sendOrder = (id) => {
  const o = (db.orders||[]).find(x=>x.id===id);
  if (!o) return;
  let s = supplierList().find(x=>x.id===o.supplierId);
  let phone = String(s?.phone||"").replace(/[^0-9]/g,"");
  if (!phone && !s?.email) {
    const typed = prompt("Aucun numéro WhatsApp ni e-mail pour « " + (s?s.name:"ce fournisseur") + " ».\nSaisissez son numéro WhatsApp (ex. 2250102030405) pour envoyer la commande :", "");
    const digits = String(typed||"").replace(/[^0-9]/g,"");
    if (digits.length < 8) {
      navigator.clipboard?.writeText(orderText(o));
      toast("Commande NON envoyée : aucun numéro. Texte copié pour un envoi manuel.");
      return;
    }
    phone = digits;
    db.suppliers = db.suppliers || [];
    let rec = db.suppliers.find(x=>x.id===o.supplierId);
    if (!rec) {
      rec = {id: uid(), name: s?s.name:"Fournisseur", contact:"", phone:"", email:"", address:"", city:"", products:"", payTerms:"", leadTime:"", note:""};
      db.suppliers.push(rec);
      o.supplierId = rec.id;
    }
    rec.phone = typed.trim();
    s = rec;
    save();
  }
  const inFrame = window.parent && window.parent !== window;
  const win = window.open("about:blank", "_blank");
  const finish = (link) => {
    const text = orderText(o) + (link ? "\n\nMerci de confirmer la commande ici : " + link : "");
    if (link) o.confirmLink = link;
    if (!win) {
      navigator.clipboard?.writeText(text);
      toast("WhatsApp n'a pas pu s'ouvrir. Texte copié : collez-le au fournisseur.");
      save(); render(); return;
    }
    if (phone) win.location.href = "https://wa.me/"+phone+"?text="+encodeURIComponent(text);
    else win.location.href = "mailto:"+s.email+"?subject="+encodeURIComponent("Commande du "+o.date)+"&body="+encodeURIComponent(text);
    setTimeout(() => {
      const ok = confirm("Avez-vous bien appuyé sur Envoyer dans " + (phone?"WhatsApp":"votre messagerie") + " ?\nOK = marquer la commande « envoyée ».");
      if (ok && !["reçue","confirmée"].includes(o.status)) o.status = "envoyée";
      toast(ok ? "Commande marquée envoyée. Elle passera à « confirmée » quand le fournisseur validera le lien." : "Commande laissée en brouillon.");
      save(); render();
    }, 1500);
  };
  if (!inFrame) { finish(null); return; }
  pendingOrderLinks[o.id] = finish;
  setTimeout(() => { if (pendingOrderLinks[o.id]) { delete pendingOrderLinks[o.id]; finish(null); } }, 10000);
  window.parent.postMessage({ type: "provende:order-link", orderId: o.id, snapshot: {
    supplier: supplierName(o.supplierId), date: o.date, expected: o.expected||"", note: o.note||"",
    lines: (o.lines||[]).map(l=>({ name: db.materials.find(m=>m.id===l.materialId)?.name || l.materialId, qty:+l.qty||0, unitPrice:+l.unitPrice||0 }))
  }}, window.location.origin);
};
window.receiveOrder = (id) => {
  const o = (db.orders||[]).find(x=>x.id===id);
  if (!o) return;
  if (!confirm("Enregistrer cette commande comme reçue ? Les quantités seront ajoutées au stock et aux entrées.")) return;
  (o.lines||[]).forEach(l => {
    db.receipts.push({id:uid(), date:new Date().toISOString().slice(0,10), materialId:l.materialId, qty:+l.qty||0,
      note:"Commande "+supplierName(o.supplierId), orderId:o.id});
    const m = db.materials.find(x=>x.id===l.materialId);
    if (m) m.stock = (+m.stock||0) + (+l.qty||0);
  });
  o.status = "reçue";
  save(); render();
};

/* ===== Export / Import : sauvegarde JSON, tableur, PDF ===== */
function download(name, content, mime){
  const blob = content instanceof Blob ? content : new Blob([content], {type: mime||"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ===== Réinitialisation protégée (double confirmation + sauvegarde automatique) ===== */
function dbIsEmpty(d){
  try{
    return !(d.materials||[]).length && !(d.finished||[]).length && !(d.formulas||[]).length
      && !(d.suppliers||[]).length && !(d.receipts||[]).length && !(d.movements||[]).length
      && !(d.production||[]).length && !(d.sales||[]).length && !(d.arrangements||[]).length
      && !Object.keys(d.days||{}).length && !(d.orders||[]).length;
  }catch{ return true; }
}
window.safeReset = function(){
  if (dbIsEmpty(db)) { toast("Rien à réinitialiser"); return; }
  if (!confirm("Attention : cette action efface TOUTES vos données (stock, production, ventes, formules, historique). Une sauvegarde sera téléchargée avant. Continuer ?")) return;
  const answer = prompt("Pour confirmer définitivement, tapez : REINITIALISER");
  if (!answer || answer.trim().toUpperCase() !== "REINITIALISER") { toast("Réinitialisation annulée"); return; }
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
  try { download("provende-sauvegarde-avant-reset-"+stamp+".json", JSON.stringify(db,null,2), "application/json"); } catch {}
  try { localStorage.setItem("provende-backup-"+stamp, JSON.stringify(db)); } catch {}
  db = structuredClone(DEFAULT);
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "provende:reset", data: db }, window.location.origin);
    }
  } catch {}
  localStorage.setItem(KEY, JSON.stringify(db));
  render();
  toast("Réinitialisé — une sauvegarde a été téléchargée");
};
/* ===== Points de restauration (sauvegarde / restauration) ===== */
function listBackups(){
  const out = [];
  try {
    for (let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if (k && k.startsWith("provende-backup-")) out.push(k);
    }
  } catch {}
  return out.sort().reverse();
}
window.createBackup = function(){
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
  try { localStorage.setItem("provende-backup-"+stamp, JSON.stringify(db)); }
  catch { toast("Mémoire du navigateur pleine : utilisez le fichier téléchargé"); }
  const keys = listBackups(); keys.slice(10).forEach(k=>{ try{localStorage.removeItem(k);}catch{} });
  download("provende-sauvegarde-"+stamp+".json", JSON.stringify(db,null,2), "application/json");
  toast("Sauvegarde créée"); openBackups();
};
window.restoreBackup = function(key){
  let data; try { data = JSON.parse(localStorage.getItem(key)||""); } catch {}
  if (!data) { toast("Sauvegarde illisible"); return; }
  if (!confirm("Remplacer les données actuelles par cette sauvegarde ? (Une sauvegarde de l'état actuel sera faite avant.)")) return;
  if (!dbIsEmpty(db)) { const s = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-"); try{localStorage.setItem("provende-backup-"+s+"-avant-restauration", JSON.stringify(db));}catch{} }
  db = {...structuredClone(DEFAULT), ...data}; save(); closeModal(); render(); toast("Données restaurées");
};
window.deleteBackup = function(key){ if(confirm("Supprimer ce point de restauration ?")){ localStorage.removeItem(key); openBackups(); } };
window.openBackups = function(){
  const keys = listBackups();
  const label = k => { const s=k.replace("provende-backup-",""); const m=s.match(/^(\d{4})-(\d\d)-(\d\d)-(\d\d)-(\d\d)/); return (m?`${m[3]}/${m[2]}/${m[1]} à ${m[4]}h${m[5]}`:s) + (s.includes("avant-restauration")?" (avant restauration)":""); };
  openModal(`<h2>Sauvegarder / Restaurer</h2>
    <p class="sub">Créez un point de restauration avant toute grosse modification. Après une réinitialisation regrettée, choisissez la sauvegarde « avant reset » et cliquez Restaurer.</p>
    <div class="actions" style="margin:12px 0"><button class="btn" onclick="createBackup()">Créer une sauvegarde maintenant</button></div>
    <div class="table-wrap"><table><thead><tr><th>Point de restauration</th><th></th></tr></thead><tbody>
    ${keys.length ? keys.map(k=>`<tr><td>${label(k)}</td><td class="row-actions"><button class="icon-btn" onclick="restoreBackup('${k}')">Restaurer</button><button class="icon-btn" onclick="deleteBackup('${k}')">Supprimer</button></td></tr>`).join("") : `<tr><td colspan="2" class="sub">Aucune sauvegarde sur cet appareil.</td></tr>`}
    </tbody></table></div>
    <div class="full" style="margin-top:12px"><label class="sub">Ou restaurer depuis un fichier de sauvegarde (.json)</label><input type="file" accept="application/json,.json" onchange="importJSON(event)"></div>
    <div id="impState" class="sub" style="margin-top:8px"></div>
    <div class="actions" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Fermer</button></div>`);
};

const matName = id => (db.materials.find(x=>x.id===id)||{}).name || id || "—";
const finName = id => (db.finished.find(x=>x.id===id)||{}).name || id || "—";

/* Journal unifié entrées / sorties / arrangements / production / ventes */
window.historyEvents = () => {
  const ev = [];
  (db.receipts||[]).forEach(r => ev.push({id:r.id, date:r.date, kind:"Entrée", element:matName(r.materialId), qty:r.qty, unit:"kg", detail:"", note:r.note||""}));
  (db.movements||[]).forEach(m => {
    if (m.type === "adj") {
      const diff = m.diff != null ? m.diff : (m.after||0)-(m.before||0);
      ev.push({id:m.id, date:m.date, kind:"Arrangement", element:matName(m.materialId), qty:diff, unit:"kg",
        detail:(m.before!=null?fmt(m.before)+" → "+fmt(m.after):""), note:m.note||""});
    } else {
      ev.push({id:m.id, date:m.date, kind:m.type==="in"?"Entrée":"Sortie", element:matName(m.materialId), qty:m.qty, unit:"kg", detail:"", note:m.note||""});
    }
  });
  Object.entries(db.days||{}).forEach(([date, d]) => {
    Object.entries(d.formulas||{}).forEach(([fid, t]) => {
      if (t) ev.push({id:date+fid, date, kind:"Production", element:forName(fid), qty:t, unit:"t", detail:"", note:d.note||""});
    });
    if (d.faciKg) ev.push({id:date+"faci", date, kind:"Production", element:"Maïs FACI", qty:d.faciKg, unit:"kg", detail:"", note:d.note||""});
  });
  (db.sales||[]).forEach(s => ev.push({id:s.id, date:s.date, kind:"Vente", element:finName(s.finishedId), qty:s.qty, unit:"kg",
    detail:s.unitPrice?fmt(s.unitPrice,0)+" F":"", note:s.note||""}));
  return ev.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
};

function toCSV(rows){
  const esc = v => {
    const s = v==null ? "" : String(v);
    return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  return "\uFEFF" + rows.map(r => r.map(esc).join(";")).join("\r\n");
}
function historyRows(){

function sheetXml(name, rows){
  const esc = v => String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const cell = v => typeof v === "number" && isFinite(v)
    ? `<Cell><Data ss:Type="Number">${v}</Data></Cell>`
    : `<Cell><Data ss:Type="String">${esc(v)}</Data></Cell>`;
  return `<Worksheet ss:Name="${esc(name).slice(0,30)}"><Table>${
    rows.map(r=>`<Row>${r.map(cell).join("")}</Row>`).join("")}</Table></Worksheet>`;
}

function parseCSV(text){
  const clean = text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n").trim();
  if (!clean) return [];
  const first = clean.split("\n")[0];
  const sep = [";","\t",","].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const out = []; let row = []; let cur = ""; let q = false;
  for (let i=0;i<clean.length;i++){
    const c = clean[i];
    if (q) {
      if (c === '"' && clean[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === sep) { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); out.push(row); row = []; cur = ""; }
    else cur += c;
  }
  row.push(cur); out.push(row);
  return out.filter(r => r.some(c => String(c).trim() !== ""));
}
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
function typeFromLabel(v){
  const n = norm(v);
  if (n.startsWith("entr") || n.includes("recept") || n.includes("achat")) return "entree";
  if (n.startsWith("sort") || n.includes("conso") || n.includes("casse") || n.includes("perte")) return "sortie";
  if (n.startsWith("prod") || n.includes("fabric")) return "production";
  if (n.startsWith("vent") || n.includes("livrais")) return "vente";
  if (n.startsWith("arrang") || n.includes("ajust") || n.includes("inventaire")) return "ajustement";
  return "";
}
const ABBR = {"t":"tourteau","tx":"tourteau","tt":"tourteau","fb":"farine basse","f":"farine","cm":"coquille marine","coq":"coquille","mais":"mais","ms":"mais","px":"px","son":"son","cq":"coquille"};
function tokens(s){
  return norm(s).replace(/[^a-z0-9%. ]+/g," ").split(/[\s.]+/).filter(Boolean)
    .map(w => ABBR[w] || w).join(" ").split(" ").filter(w => w.length>1 || /\d/.test(w));
}
function matchTarget(type, label){
  const n = norm(label);
  if (!n) return null;
  const pool = type === "production" ? db.formulas.map(f=>({id:f.id, txt:f.id+" "+f.name}))
    : type === "vente" ? db.finished.map(a=>({id:a.id, txt:a.name}))
    : db.materials.map(m=>({id:m.id, txt:m.name}));
  const exact = pool.find(p=>norm(p.txt)===n);
  if (exact) return exact.id;
  const qt = tokens(label);
  if (!qt.length) return null;
  let best = null, bestScore = 0;
  for (const p of pool){
    const pt = tokens(p.txt);
    if (!pt.length) continue;
    let hit = 0;
    for (const q of qt){
      if (pt.some(t => t === q || (q.length>=4 && t.startsWith(q)) || (t.length>=4 && q.startsWith(t)))) hit++;
    }
    const score = hit / Math.max(qt.length, pt.length);
    if (score > bestScore) { bestScore = score; best = p.id; }
  }
  return bestScore >= 0.5 ? best : null;
}
window.importSheet = (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (/\.(xlsx|xls)$/i.test(file.name)) {
    document.getElementById("impState").textContent = "Dans Excel, faites « Enregistrer sous » puis choisissez CSV, et importez ce fichier CSV.";
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const table = parseCSV(String(reader.result));
    if (table.length < 2) { document.getElementById("impState").textContent = "Fichier vide ou illisible."; return; }
    const head = table[0].map(norm);
    const col = (...names) => {
      for (const nm of names) { const i = head.findIndex(h => h.includes(norm(nm))); if (i !== -1) return i; }
      return -1;
    };
    const ci = {date:col("date"), type:col("type"), el:col("element","matiere","produit","designation"),
      qty:col("quantite","qte","quantity"), unit:col("unite","unit"), price:col("prix"), note:col("note","observation","commentaire")};
    const today = new Date().toISOString().slice(0,10);
    const rows = table.slice(1).map(r => {
      const type = typeFromLabel(ci.type>-1 ? r[ci.type] : "");
      if (!type) return null;
      const label = ci.el>-1 ? String(r[ci.el]||"").trim() : "";
      const qty = Number(String(ci.qty>-1?r[ci.qty]:"0").replace(/\s/g,"").replace(",", "."));
      const unitRaw = norm(ci.unit>-1 ? r[ci.unit] : "kg");
      const unit = unitRaw.startsWith("t") ? "t" : unitRaw.startsWith("sac") ? "sac" : "kg";
      const priceRaw = ci.price>-1 ? String(r[ci.price]||"").replace(/\s/g,"").replace(",", ".") : "";
      let date = String(ci.date>-1?r[ci.date]:"").trim();
      const fr = date.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/);
      if (fr) date = `${fr[3].length===2?"20"+fr[3]:fr[3]}-${fr[2].padStart(2,"0")}-${fr[1].padStart(2,"0")}`;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) date = today;
      return {type, date, targetId: matchTarget(type, label), label,
        qty: isFinite(qty)?qty:0, unit, unitPrice: priceRaw?Number(priceRaw):null, note: ci.note>-1?String(r[ci.note]||""):""};
    }).filter(r => r && r.qty);
    if (!rows.length) { document.getElementById("impState").textContent = "Aucune ligne exploitable. Vérifiez la colonne Type (Entrée, Sortie, Production, Vente, Arrangement)."; return; }
    window.provendeReview(rows);
  };
  reader.readAsText(file, "utf-8");
};

/* ===== Mini-calculatrice dans les cases à nombre =====
   On peut taper 12+3*2, (45,5+10)/2, 3*25 … la case affiche le résultat. */
(function(){
  const isNum = (el) => el && el.tagName === "INPUT" && (el.type === "number" || el.dataset.calcNum === "1");

  function prepare(el){
    if (el.type === "number") {
      el.dataset.calcNum = "1";
      el.type = "text";
      el.setAttribute("inputmode", "decimal");
      el.autocomplete = "off";
      if (!el.title) el.title = "Vous pouvez écrire un calcul, ex. 12+3*2";
    }
  }

  function evaluate(el){
    if (!el || el.dataset.calcNum !== "1") return;
    const raw = (el.value || "").trim();
    if (!raw || !/[+\-*/()%]/.test(raw.slice(1))) return;
    if (!/^[0-9+\-*/().,%\s]+$/.test(raw)) return;
    const expr = raw.replace(/,/g, ".").replace(/%/g, "/100");
    let result;
    try { result = Function('"use strict";return (' + expr + ')')(); } catch { return; }
    if (typeof result !== "number" || !isFinite(result)) return;
    el.value = String(Math.round(result * 1e6) / 1e6);
    el.dispatchEvent(new Event("input", { bubbles: true }));
    el.dispatchEvent(new Event("change", { bubbles: true }));
  }

  document.addEventListener("focusin", (e) => { if (isNum(e.target)) prepare(e.target); }, true);
  document.addEventListener("focusout", (e) => { if (isNum(e.target)) evaluate(e.target); }, true);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && isNum(e.target)) { evaluate(e.target); }
  }, true);
  document.addEventListener("mousedown", (e) => {
    const active = document.activeElement;
    if (active !== e.target && isNum(active)) evaluate(active);
  }, true);
})();

(function(){

        <div class="full"><label>Prendre une photo</label><input type="file" accept="image/*" capture="environment" id="scanCam"></div>

    });

  }

  function readAsDataUrl(file){
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(new Error("Fichier illisible"));
      r.readAsDataURL(file);
    });
  }

  function shrinkImage(dataUrl){
    return new Promise((res) => {
      const img = new Image();
      img.onload = () => {
        const max = 1600;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => res(dataUrl);
      img.src = dataUrl;
    });
  }

  async function handleFile(e){
    const file = e.target.files && e.target.files[0];

    if (msg.type !== "provende:scan-result") return;
    if (!Array.isArray(msg.rows) || !msg.rows.length) { setState("Aucune ligne n'a pu être lue. Reprenez la photo bien à plat, avec une bonne lumière."); return; }

  const TYPES = [["entree","Entrée matière"],["sortie","Sortie matière"],["production","Production"],["vente","Vente aliment"],["ajustement","Arrangement (stock réel)"]];

      };

  };

  function targetOptions(r){
    const cur = r.type === "production" ? r.formulaId : r.type === "vente" ? r.finishedId : r.materialId;
    const ph = `<option value="" ${!cur?"selected":""}>— À choisir —</option>`;

      ${rows.map((r,i)=>`<tr>
        <td><input type="checkbox" data-k="use" data-i="${i}" checked></td>
        <td><select data-k="type" data-i="${i}">${TYPES.map(([v,l])=>`<option value="${v}" ${r.type===v?"selected":""}>${l}</option>`).join("")}</select></td>
        <td><input type="date" data-k="date" data-i="${i}" value="${(r.date||"").slice(0,10)}" style="width:140px"></td>
        <td><select data-k="target" data-i="${i}">${targetOptions(r)}</select><div class="sub" style="font-size:.72rem">${(r.label||"").replace(/</g,"")}</div></td>
        <td><input type="number" step="0.01" data-k="qty" data-i="${i}" value="${r.qty||0}" style="width:100px"></td>
        <td><select data-k="unit" data-i="${i}">
          <option value="kg" ${r.unit==="kg"?"selected":""}>kg</option>
          <option value="t" ${r.unit==="t"?"selected":""}>tonne</option>
          <option value="sac" ${r.unit==="sac"?"selected":""}>sac 50 kg</option>
        </select></td>
        <td><input type="number" step="0.01" data-k="price" data-i="${i}" value="${r.unitPrice==null?"":r.unitPrice}" style="width:100px"></td>
        <td><input data-k="note" data-i="${i}" value="${(r.note||r.client||"").replace(/"/g,"")}" style="width:150px"></td>
      </tr>`).join("")}
      </tbody></table></div>
      <div id="scanState" class="sub" style="margin-top:8px"></div>
      <div class="actions" style="margin-top:12px">
        <button class="btn" id="scanApply">Enregistrer ces lignes</button>
        <button class="btn ghost" onclick="closeModal()">Annuler</button>
      </div>`);
    document.getElementById("modal").addEventListener("change", (ev) => {
      const t = ev.target;
      if (t.dataset && t.dataset.k === "type") { rows[+t.dataset.i].type = t.value; renderReview(); }
    });
    document.getElementById("scanApply").addEventListener("click", applyRows);
  }

  function toKg(qty, unit){
    if (unit === "t") return qty * 1000;
    if (unit === "sac") return qty * 50;
    return qty;
  }

  function applyRows(){
    const get = (i,k) => document.querySelector(`[data-k="${k}"][data-i="${i}"]`);
    let n = 0, skipped = 0;
    rows.forEach((r, i) => {
      if (!get(i,"use").checked) return;
      const type = get(i,"type").value;
      const date = get(i,"date").value || new Date().toISOString().slice(0,10);
      const target = get(i,"target").value;
      const qty = +get(i,"qty").value || 0;
      const unit = get(i,"unit").value;
      const price = get(i,"price").value === "" ? null : +get(i,"price").value;
      const note = get(i,"note").value;
      if (!qty || !target) { skipped++; return; }
      const kg = toKg(qty, unit);
      if (type === "entree") {
        db.receipts.push({id:uid(), date, materialId:target, qty:kg, note:note||"Scan fiche"});
        const m = db.materials.find(x=>x.id===target);
        if (m) { m.stock = (+m.stock||0) + kg; if (price) m.unitPrice = price; }
      } else if (type === "sortie") {
        db.movements.push({id:uid(), date, materialId:target, type:"out", qty:kg, note:note||"Scan fiche"});
        const m = db.materials.find(x=>x.id===target);
        if (m) m.stock = (+m.stock||0) - kg;
      } else if (type === "production") {
        const day = db.days[date] || {formulas:{}, faciKg:0, note:""};
        day.formulas[target] = (day.formulas[target]||0) + kg/1000;
        if (note) day.note = note;
        db.days[date] = day;
      } else if (type === "ajustement") {
        const m = db.materials.find(x=>x.id===target);
        if (m) {
          const before = m.stock;
          m.stock = kg;
          db.movements.push({id:uid(), date, materialId:target, type:"adj", qty:kg, before, after:kg, diff:kg-before, note:note||"Arrangement (import)"});
        }
      } else if (type === "vente") {
        db.sales = db.sales || [];
        db.sales.push({id:uid(), date, finishedId:target, qty:kg, unitPrice:price, note});
        const a = db.finished.find(x=>x.id===target);
        if (a) { a.qty -= kg; if (price) a.unitPrice = price; }
      }
      n++;
    });
    if (!n) { setState(skipped ? "Choisissez l'élément (« — À choisir — ») pour les lignes cochées." : "Aucune ligne cochée valide."); return; }
    save(); closeModal(); render();
    toast(n + " ligne(s) intégrée(s)" + (skipped ? " — " + skipped + " ligne(s) sans élément ignorée(s)" : ""));
  }
})();

/* ===== Dialogue avec l'app ===== */
(function(){
  const inFrame = window.parent !== window;
  let msgs = [];
  let busy = false;

  function snapshot(){
    const avg = dailyNeed();
    const L = [];
    L.push("Mois de travail : " + db.month);
    L.push("MATIÈRES (id | nom | stock kg | prix F/kg | conso moyenne j | statut) :");
    db.materials.forEach(m => L.push(`${m.id} | ${m.name} | ${fmt(m.stock)} | ${fmt(m.unitPrice,0)} | ${fmt(avg[m.id]||0)} | ${statusOf(m,avg).label}`));
    L.push("FORMULES (id | nom | coût/t F) :");
    db.formulas.forEach(f => L.push(`${f.id} | ${f.name} | ${fmt(formulaCost(f),0)}`));
    L.push("ALIMENTS FINIS (id | nom | qté | prix F) :");
    db.finished.forEach(a => L.push(`${a.id} | ${a.name} | ${fmt(a.qty,0)} | ${fmt(a.unitPrice,0)}`));
    L.push("FOURNISSEURS (id | nom | WhatsApp | matières fournies) :");
    supplierList().forEach(x => L.push(`${x.id} | ${x.name} | ${x.phone||"—"} | ${supplierMaterials(x).map(m=>m.id+" "+m.name).join(", ")}`));
    L.push("40 DERNIERS MOUVEMENTS (date | type | élément | qté) :");
    window.historyEvents().slice(0,40).forEach(e => L.push(`${e.date} | ${e.kind} | ${e.element} | ${fmt(e.qty,1)} ${e.unit}`));
    return L.join("\n").slice(0, 29000);
  }

  const esc = t => String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  let voiceOn = (()=>{ try { return localStorage.getItem("provende-voice") !== "off"; } catch(e){ return true; } })();
  function speak(text){
    const s = window.speechSynthesis; if (!s) return;
    s.cancel();
    const clean = String(text||"").replace(/[*_#`>|]/g," ").replace(/https?:\/\/\S+/g,"lien").slice(0,1500);
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "fr-FR"; u.rate = 1;
    const v = s.getVoices().find(v=>/^fr/i.test(v.lang)); if (v) u.voice = v;
    s.speak(u);
  }
  window.provendeSpeak = (i) => { const m = msgs[i]; if (m) speak(m.content); };
  window.provendeToggleVoice = () => {
    voiceOn = !voiceOn;
    try { localStorage.setItem("provende-voice", voiceOn?"on":"off"); } catch(e){}
    if (!voiceOn && window.speechSynthesis) window.speechSynthesis.cancel();
    const b = document.getElementById("chatVoice"); if (b) b.textContent = voiceOn ? "🔊 Voix activée" : "🔇 Voix coupée";
  };
  function paint(){
    const box = document.getElementById("chatLog");
    if (!box) return;
    box.innerHTML = msgs.length ? msgs.map((m,i) => `
      <div style="margin:0 0 10px;text-align:${m.role==="user"?"right":"left"}">
        <div style="display:inline-block;max-width:88%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;
          background:${m.role==="user"?"var(--accent)":"var(--panel-2,rgba(0,0,0,.06))"};
          color:${m.role==="user"?"#fff":"inherit"}">${esc(m.content)}</div>${m.role==="assistant"?`<button class="btn ghost" style="padding:2px 8px;margin-left:4px" title="Écouter" onclick="provendeSpeak(${i})">🔊</button>`:""}
      </div>`).join("") : `<p class="sub">Posez une question (« quel est mon stock de maïs ? », « coût de la formule A7 ? ») ou dictez une écriture (« enregistre 2000 kg de maïs reçus aujourd'hui »).</p>`;
    box.scrollTop = box.scrollHeight;
  }

  function open(){
    openModal(`<h2>Dialoguer avec l'app</h2>
      <div id="chatLog" style="max-height:46vh;overflow:auto;margin:10px 0;padding:4px"></div>
      <div id="chatRows"></div>
      <div class="grid-form"><div class="full">
        <input id="chatInput" placeholder="Votre question ou votre écriture…" onkeydown="if(event.key==='Enter'){event.preventDefault();provendeChatSend()}">
      </div></div>
      <div class="actions" style="margin-top:12px">
        <button class="btn" id="chatSend" onclick="provendeChatSend()">Envoyer</button>
        <button class="btn ghost" id="chatMic" onclick="provendeMic()" title="Parler à l'app">🎙️ Parler</button>
        <button class="btn ghost" onclick="closeModal()">Fermer</button>
      </div>`);
    paint();
    setTimeout(()=>{ const i = document.getElementById("chatInput"); if (i) i.focus(); }, 50);
  }

  let rec = null;
  window.provendeMic = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const mic = document.getElementById("chatMic");
    if (!SR) { toast("La dictée vocale n'est pas disponible sur ce navigateur (essayez Chrome)."); return; }
    if (rec) { rec.stop(); return; }
    rec = new SR();
    rec.lang = "fr-FR"; rec.interimResults = true; rec.continuous = false;
    const input = document.getElementById("chatInput");
    let finalText = "";
    rec.onresult = (ev) => {
      let t = "";
      for (const r of ev.results) { t += r[0].transcript; if (r.isFinal) finalText = t; }
      if (input) input.value = t;
    };
    rec.onerror = (ev) => { toast(ev.error === "not-allowed" ? "Autorisez le micro pour parler à l'app." : "Je n'ai pas bien entendu, réessayez."); };
    rec.onend = () => {
      rec = null;
      if (mic) mic.textContent = "🎙️ Parler";
      const txt = (finalText || (input && input.value) || "").replace(/^\s*suivi\s*provende[,\s]*/i, "").trim();
      if (txt && input) { input.value = txt; window.provendeChatSend(); }
    };
    if (mic) mic.textContent = "⏹ J'écoute… (stop)";
    rec.start();
  };

  window.provendeVoiceOrder = () => {
    const ord = window.__chatOrder; if (!ord) return;
    const sup = ord.supplierId ? supplierList().find(x=>x.id===ord.supplierId) : null;
    const lines = ord.lines.filter(l=>db.materials.find(m=>m.id===l.materialId))
      .map(l=>({materialId:l.materialId, qty:+l.qty, unitPrice:+(db.materials.find(m=>m.id===l.materialId)?.unitPrice)||0}));
    if (!lines.length) { toast("Matière introuvable dans votre stock."); return; }
    if (!sup) { closeModal(); window.editOrder(null, "", lines); toast("Choisissez le fournisseur puis enregistrez."); return; }
    const o = {id:uid(), date:new Date().toISOString().slice(0,10), supplierId:sup.id, expected:"", note:"Commande vocale", status:"brouillon", lines};
    db.orders = db.orders || []; db.orders.push(o); save();
    window.__chatOrder = null;
    closeModal(); render();
    window.sendOrder(o.id);
  };

  window.provendeChatSend = () => {
    const input = document.getElementById("chatInput");
    if (!input || busy) return;
    const q = input.value.trim();
    if (!q) return;
    if (!inFrame) { msgs.push({role:"assistant", content:"Connectez-vous à votre compte pour dialoguer avec l'app."}); paint(); return; }
    input.value = "";
    msgs.push({role:"user", content:q});
    busy = true;
    const btn = document.getElementById("chatSend");
    if (btn) { btn.disabled = true; btn.textContent = "Réflexion…"; }
    paint();
    window.parent.postMessage({
      type: "provende:chat",
      question: q,
      history: msgs.slice(-13, -1).map(m => ({role:m.role, content:String(m.content).slice(0,4000)})),
      snapshot: snapshot()
    }, window.location.origin);
  };

  function done(){
    busy = false;
    const btn = document.getElementById("chatSend");
    if (btn) { btn.disabled = false; btn.textContent = "Envoyer"; }
  }

  window.addEventListener("message", (e) => {
    if (e.origin !== window.location.origin) return;
    const msg = e.data;
    if (!msg) return;
    if (msg.type === "provende:chat-error") {
      msgs.push({role:"assistant", content: msg.message || "La réponse n'a pas pu être obtenue."});
      done(); paint(); return;
    }
    if (msg.type !== "provende:chat-reply") return;
    msgs.push({role:"assistant", content: msg.answer || "D'accord."});
    done(); paint();
    if (voiceOn) speak(msg.answer || "D'accord.");
    if (Array.isArray(msg.rows) && msg.rows.length) {
      const rows = msg.rows;
      const box = document.getElementById("chatRows");
      if (box) box.innerHTML = `<div class="card" style="padding:10px">
        <p class="sub" style="margin:0 0 8px">${rows.length} écriture(s) proposée(s) — à vérifier avant enregistrement.</p>
        <button class="btn" onclick="provendeReview(window.__chatRows)">Vérifier et enregistrer</button></div>`;
      window.__chatRows = rows;
    }
    if (msg.order && Array.isArray(msg.order.lines) && msg.order.lines.length) {
      window.__chatOrder = msg.order;
      const box = document.getElementById("chatRows");
      const sup = msg.order.supplierId ? supplierList().find(x=>x.id===msg.order.supplierId) : null;
      const desc = msg.order.lines.map(l=>{const m=db.materials.find(x=>x.id===l.materialId);return esc(m?m.name:l.label)+" : "+fmt(l.qty)+" kg";}).join("<br>");
      if (box) box.innerHTML = `<div class="card" style="padding:10px">
        <p style="margin:0 0 6px"><b>Commande à envoyer</b> — ${esc(sup?sup.name:"fournisseur à choisir")}${sup&&sup.phone?" ("+esc(sup.phone)+")":""}</p>
        <p class="sub" style="margin:0 0 8px">${desc}</p>
        <button class="btn" onclick="provendeVoiceOrder()">${sup?"Envoyer par WhatsApp":"Choisir le fournisseur"}</button></div>`;
    }
  });

  const btn = document.getElementById("btnChat");
  if (btn) btn.addEventListener("click", open);
})();

</script>
<script src="/provende-i18n.js"></script>
</body>
